name: Comprobar estudio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix cloudrun/unify
      - run: npm test
      - run: npm run check
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:render
